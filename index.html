<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Feliz Cumpleaños, Melanie!</title>
<meta name="description" content="Una página de cumpleaños para Melanie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<section id="countdown-screen" class="countdown-screen">
  <p class="eyebrow">✨ falta poco ✨</p>
  <h1 class="logo">Melanie</h1>
  <div class="countdown" id="countdown" aria-live="polite">
    <div class="time-block">
      <span class="time-value" id="cd-days">00</span>
      <span class="time-label">días</span>
    </div>
    <div class="time-block">
      <span class="time-value" id="cd-hours">00</span>
      <span class="time-label">horas</span>
    </div>
    <div class="time-block">
      <span class="time-value" id="cd-mins">00</span>
      <span class="time-label">min</span>
    </div>
    <div class="time-block">
      <span class="time-value" id="cd-secs">00</span>
      <span class="time-label">seg</span>
    </div>
  </div>
  <p class="tagline">Vuelve el 14 de noviembre para ver la sorpresa 🎁</p>
</section>

<div id="celebration" class="celebration" hidden></div>

<script src="script.js"></script>
</body>
</html>
